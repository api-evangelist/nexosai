    ModelResponseProperties:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/responses_Metadata'
        top_logprobs:
          description: 'An integer between 0 and 20 specifying the number of most likely tokens to

            return at each token position, each with an associated log probability.

            '
          type: integer
          minimum: 0
          maximum: 20
          nullable: true
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
          description: 'What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.

            We generally recommend altering this or `top_p` but not both.

            '
          nullable: true
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 1
          description: 'An alternative to sampling with temperature, called nucleus sampling,

            where the model considers the results of the tokens with top_p probability

            mass. So 0.1 means only the tokens comprising the top 10% probability mass

            are considered.


            We generally recommend altering this or `temperature` but not both.

            '
          nullable: true
        user:
          type: string
          deprecated: true
          description: 'Deprecated in favor of `safety_identifier` and `prompt_cache_key`; use `prompt_cache_key` to maintain caching. A stable end-user identifier to improve cache hit rates and help detect abuse.

            '
        safety_identifier:
          type: string
          description: 'A stable identifier used to help detect users who may violate usage policies. Use a unique per-user string (e.g., a hash of username or email) to avoid sending identifying information.

            '
        prompt_cache_key:
          type: string
          description: 'Used to cache responses for similar requests and improve cache hit rates. Replaces the `user` field.

            '
        service_tier:
          $ref: '#/components/schemas/ServiceTier'
        prompt_cache_retention:
          type: string
          enum:
          - in-memory
          - 24h
          description: 'Retention policy for the prompt cache. Set to `24h` to keep cached prefixes active longer (up to 24 hours).

            '
          nullable: true
