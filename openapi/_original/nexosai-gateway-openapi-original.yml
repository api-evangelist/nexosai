              reason:
                type: string
                description: The reason why the response is incomplete.
                enum:
                - max_output_tokens
                - content_filter
            nullable: true
          output:
            type: array
            description: "An array of content items generated by the model.\n\n- The length and order\
              \ of items in the `output` array is dependent\n  on the model's response.\n- Rather than\
              \ accessing the first item in the `output` array and\n  assuming it's an `assistant` message\
              \ with the content generated by\n  the model, you might consider using the `output_text`\
              \ property where\n  supported in SDKs.\n"
            items:
              $ref: '#/components/schemas/OutputItem'
