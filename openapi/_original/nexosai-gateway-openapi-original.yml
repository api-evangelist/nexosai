      description: 'The results of a file search tool call. See the file search guide for more information.

        '
      properties:
        id:
          type: string
          description: 'The unique ID of the file search tool call.

            '
        type:
          type: string
          enum:
          - file_search_call
          default: file_search_call
          description: 'The type of the file search tool call. Always `file_search_call`.

            '
        status:
          type: string
          description: 'The status of the file search tool call. One of `in_progress`,

            `searching`, `incomplete` or `failed`,

            '
          enum:
          - in_progress
          - searching
          - completed
          - incomplete
          - failed
        queries:
          type: array
          items:
            type: string
          description: 'The queries used to search for files.

            '
        results:
          type: array
          description: 'The results of the file search tool call.

            '
          items:
            type: object
            properties:
              file_id:
                type: string
                description: 'The unique ID of the file.

                  '
              text:
                type: string
                description: 'The text that was retrieved from the file.

                  '
              filename:
                type: string
                description: 'The name of the file.

                  '
              attributes:
                $ref: '#/components/schemas/VectorStoreFileAttributes'
              score:
                type: number
                format: float
                description: 'The relevance score of the file - a value between 0 and 1.

                  '
          nullable: true
    VectorStoreFileAttributes:
      type: object
      nullable: true
      description: 'Set of 16 key-value pairs that can be attached to an object. This can be

        useful for storing additional information about the object in a structured

        format, and querying for objects via API or the dashboard. Keys are strings

        with a maximum length of 64 characters. Values are strings with a maximum

        length of 512 characters, booleans, or numbers.

        '
      maxProperties: 16
      propertyNames:
        type: string
        maxLength: 64
      additionalProperties:
        anyOf:
        - type: string
          maxLength: 512
        - type: number
        - type: boolean
    ComputerToolCall:
      type: object
      title: Computer tool call
      description: 'A tool call to a computer use tool. See the computer use guide for more information.

        '
      properties:
        type:
          type: string
          description: The type of the computer call. Always `computer_call`.
          enum:
          - computer_call
          default: computer_call
        id:
          type: string
          description: The unique ID of the computer call.
        call_id:
          type: string
          description: 'An identifier used when responding to the tool call with output.

            '
        action:
          $ref: '#/components/schemas/ComputerAction'
        pending_safety_checks:
          type: array
