          type: string
          description: 'The type of the file path. Always `file_path`.

            '
          enum:
          - file_path
        file_id:
          type: string
          description: 'The ID of the file.

            '
        index:
          type: integer
          description: 'The index of the file in the list of files.

            '
      required:
      - type
      - file_id
      - index
    LogProb:
      properties:
