components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 'Authenticate by sending your nexos API key in the `X-Api-Key` header (e.g. `X-Api-Key:
        nexos-...` for a user key or `X-Api-Key: nexos-team-...` for a team key). This is an alternative
        to the `Authorization: Bearer` scheme. If both `X-Nexos-Key` and `X-Api-Key` are sent, `X-Nexos-Key`
        takes precedence.'
  schemas:
    AgentSortByField:
      type: string
      enum:
      - name
      - created_at
    AgentSortOrder:
      type: string
      enum:
      - asc
      - desc
      description: Sort order, must be used together with sort_by.field.
    Agent:
      description: Represents an AI agent.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier.
        name:
          type: string
          description: Agent name.
        description:
          type: string
          description: Agent description.
          nullable: true
        instructions:
          type: string
          description: Agent instructions.
        model:
          type: string
          description: Model name.
        created_at:
          type: string
          format: date-time
          description: The time the agent was created.
      required:
      - id
      - created_at
      - name
      - model
    SortByField:
      type: string
      enum:
      - name
      - created_at
    SortOrder:
      type: string
      enum:
      - asc
      - desc
      description: Sort order, must be used together with sort_by.field.
    Assistant:
      description: Represents an AI assistant.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier.
        name:
          type: string
          description: Assistant name.
        description:
          type: string
          description: Assistant description.
          nullable: true
        instructions:
          type: string
          description: Assistant instructions.
        model:
          type: string
          description: Model name.
        created_at:
          type: string
          format: date-time
          description: The time the assistant was created.
      required:
      - id
      - created_at
      - name
      - model
    SpeechRequest:
      type: object
      additionalProperties: false
      properties:
        model:
          type: string
        input:
          type: string
          description: The text to generate audio for.
          maxLength: 4096
        voice:
          description: The voice to use when generating the audio.
          type: string
          enum:
          - alloy
          - echo
          - fable
          - onyx
          - nova
          - shimmer
        response_format:
          description: The format to output audio in.
          default: mp3
          type: string
          enum:
          - mp3
          - opus
          - aac
          - flac
          - wav
          - pcm
        speed:
          description: The speed of the generated audio.
          type: number
          default: 1
          minimum: 0.25
          maximum: 4
      required:
      - model
      - input
      - voice
    TranscriptionRequest:
      type: object
      additionalProperties: false
      properties:
        file:
          description: 'The audio file object (not file name) to transcribe, in one of these formats:
            flac, mp3, mp4, mpeg, mpga, m4a, ogg, wav, or webm.

            '
          type: string
          format: binary
        model:
          type: string
        language:
          description: 'The language of the input audio. Supplying the input language in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes)
            format will improve accuracy and latency.

            '
          type: string
        prompt:
          description: 'An optional text to guide the model''s style or continue a previous audio segment.
            The [prompt](https://platform.openai.com/docs/guides/speech-to-text/prompting) should match
            the audio language.

            '
          type: string
        response_format:
          description: 'The format of the transcript output.

            '
          type: string
          enum:
          - json
          - text
          - srt
          - verbose_json
          - vtt
          default: json
        temperature:
          description: 'The sampling temperature, between 0 and 1. Higher values like 0.8 will make the
            output more random, while lower values like 0.2 will make it more focused and deterministic.
            If set to 0, the model will use [log probability](https://en.wikipedia.org/wiki/Log_probability)
            to automatically increase the temperature until certain thresholds are hit.

            '
          type: number
          default: 0
        timestamp_granularities[]:
          description: 'The timestamp granularities to populate for this transcription. `response_format`
            must be set `verbose_json` to use timestamp granularities. Either or both of these options
            are supported: `word`, or `segment`. Note: There is no additional latency for segment timestamps,
            but generating word timestamps incurs additional latency.

            '
          type: array
          items:
            type: string
            enum:
            - word
            - segment
          default:
          - segment
      required:
      - file
      - model
    TranscriptionResponseJson:
      type: object
      description: Represents a transcription response returned by model, based on the provided input.
      properties:
        text:
          type: string
          description: The transcribed text.
        model:
          type: string
          description: The model used for generating transcription.
    TranscriptionResponseVerboseJson:
      type: object
      description: Represents a verbose json transcription response returned by model, based on the provided
        input.
      properties:
        language:
          type: string
          description: The language of the input audio.
        duration:
          type: string
          description: The duration of the input audio.
        text:
          type: string
          description: The transcribed text.
        words:
          type: array
          description: Extracted words and their corresponding timestamps.
          items:
            $ref: '#/components/schemas/TranscriptionWord'
        segments:
          type: array
          description: Segments of the transcribed text and their corresponding details.
          items:
            $ref: '#/components/schemas/TranscriptionSegment'
        model:
          type: string
          description: The model used for generating transcription.
    TranscriptionWord:
      type: object
      properties:
        word:
          type: string
          description: The text content of the word.
        start:
          type: number
          format: float
          description: Start time of the word in seconds.
        end:
          type: number
          format: float
          description: End time of the word in seconds.
    TranscriptionSegment:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the segment.
        seek:
          type: integer
          description: Seek offset of the segment.
        start:
          type: number
          format: float
          description: Start time of the segment in seconds.
        end:
          type: number
          format: float
          description: End time of the segment in seconds.
        text:
          type: string
          description: Text content of the segment.
        tokens:
          type: array
          items:
            type: integer
          description: Array of token IDs for the text content.
        temperature:
          type: number
          format: float
          description: Temperature parameter used for generating the segment.
        avg_logprob:
          type: number
          format: float
          description: Average logprob of the segment. If the value is lower than -1, consider the logprobs
            failed.
        compression_ratio:
          type: number
          format: float
          description: Compression ratio of the segment. If the value is greater than 2.4, consider the
            compression failed.
        no_speech_prob:
          type: number
          format: float
          description: Probability of no speech in the segment. If the value is higher than 1.0 and the
            `avg_logprob` is below -1, consider this segment silent.
    TranslationRequest:
      type: object
      additionalProperties: false
      properties:
        file:
          description: 'The audio file object (not file name) translate, in one of these formats: flac,
            mp3, mp4, mpeg, mpga, m4a, ogg, wav, or webm.

            '
          type: string
          format: binary
        model:
          type: string
        prompt:
          description: 'An optional text to guide the model''s style or continue a previous audio segment.
            The [prompt](https://platform.openai.com/docs/guides/speech-to-text/prompting) should be in
            English.

            '
          type: string
        response_format:
          description: 'The format of the translated transcript output.

            '
          type: string
          enum:
          - json
          - text
          - srt
          - verbose_json
          - vtt
          default: json
        temperature:
          description: 'The sampling temperature, between 0 and 1. Higher values like 0.8 will make the
            output more random, while lower values like 0.2 will make it more focused and deterministic.
            If set to 0, the model will use [log probability](https://en.wikipedia.org/wiki/Log_probability)
            to automatically increase the temperature until certain thresholds are hit.

            '
          type: number
          default: 0
      required:
      - file
      - model
    TranslationResponseJson:
      type: object
      description: Represents a translation response returned by model, based on the provided input.
      properties:
        text:
          type: string
        model:
          type: string
          description: The model used for generating translation.
    TranslationResponseVerboseJson:
      type: object
      description: Represents a verbose translation response returned by model, based on the provided
        input.
      properties:
        language:
          type: string
          description: The language of the output translation (always `english`).
        duration:
          type: string
          description: The duration of the input audio.
        text:
          type: string
          description: The translated text.
        segments:
          type: array
          description: Segments of the translated text and their corresponding details.
          items:
            $ref: '#/components/schemas/TranscriptionSegment'
        model:
          type: string
          description: The model used for generating translation.
    BatchesRequest:
      type: object
      properties:
        input_file_id:
          type: string
          description: 'The ID of an uploaded file that contains requests for the new batch.


            Your input file must be formatted as a JSONL file, and must be uploaded with the purpose set
            to "batch". The file can contain up to 50,000 requests, and can be up to 200 MB in size.

            '
        endpoint:
          type: string
          description: 'The endpoint to be used for all requests in the batch. Currently `/v1/chat/completions`,
            `/v1/embeddings`, and `/v1/completions` are supported.

            '
          enum:
          - /v1/chat/completions
          - /v1/embeddings
          - /v1/completions
        completion_window:
          type: string
          description: 'The time frame within which the batch should be processed. Currently only "24h"
            is supported.

            '
          enum:
          - 24h
          default: 24h
        metadata:
          type: object
          description: 'Optional custom metadata for the batch. This can be useful for tracking and organizing
            batches.

            '
          additionalProperties:
            type: string
      required:
      - input_file_id
      - endpoint
      - completion_window
    Batch:
      type: object
      description: 'A batch object representing a collection of requests processed together.

        '
      properties:
        id:
          type: string
          description: 'The unique identifier of the batch.

            '
        object:
          type: string
          description: 'The object type, which is always "batch".

            '
          enum:
          - batch
        endpoint:
          type: string
          description: 'The endpoint used for the batch requests.

            '
          enum:
          - /v1/chat/completions
          - /v1/embeddings
          - /v1/completions
        errors:
          type: object
          description: 'Details about any errors encountered during batch processing.

            '
          nullable: true
          properties:
            object:
              type: string
              enum:
              - list
            data:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                    description: 'Error code indicating the type of error.

                      '
                  message:
                    type: string
                    description: 'Human-readable error message.

                      '
                  param:
                    type: string
                    nullable: true
                    description: 'The parameter that caused the error, if applicable.

                      '
                  line:
                    type: integer
                    nullable: true
                    description: 'The line number in the input file where the error occurred.

                      '
        input_file_id:
          type: string
          description: 'The ID of the input file used for the batch.

            '
        completion_window:
          type: string
          description: 'The time frame within which the batch should be processed.

            '
        status:
          type: string
          description: 'The current status of the batch.

            '
          enum:
          - validating
          - failed
          - in_progress
          - finalizing
          - completed
          - expired
          - cancelling
          - cancelled
        output_file_id:
          type: string
          nullable: true
          description: 'The ID of the file containing the outputs of the batch requests. This is only
            available when the batch status is "completed".

            '
        error_file_id:
          type: string
          nullable: true
          description: 'The ID of the file containing the errors of the batch requests. This is only available
            when there are errors in the batch.

            '
        created_at:
          type: integer
          description: 'The Unix timestamp (in seconds) for when the batch was created.

            '
        in_progress_at:
          type: integer
          nullable: true
          description: 'The Unix timestamp (in seconds) for when the batch started processing.

            '
        expires_at:
          type: integer
          nullable: true
          description: 'The Unix timestamp (in seconds) for when the batch will expire.

            '
        finalizing_at:
          type: integer
          nullable: true
          description: 'The Unix timestamp (in seconds) for when the batch started finalizing.

            '
        completed_at:
          type: integer
          nullable: true
          description: 'The Unix timestamp (in seconds) for when the batch was completed.

            '
        failed_at:
          type: integer
          nullable: true
          description: 'The Unix timestamp (in seconds) for when the batch failed.

            '
        expired_at:
          type: integer
          nullable: true
          description: 'The Unix timestamp (in seconds) for when the batch expired.

            '
        cancelling_at:
          type: integer
          nullable: true
          description: 'The Unix timestamp (in seconds) for when the batch cancellation was initiated.

            '
        cancelled_at:
          type: integer
          nullable: true
          description: 'The Unix timestamp (in seconds) for when the batch was cancelled.

            '
        request_counts:
          type: object
          description: 'Statistics about the requests in the batch.

            '
          properties:
            total:
              type: integer
              description: 'Total number of requests in the batch.

                '
            completed:
              type: integer
              description: 'Number of requests that completed successfully.

                '
            failed:
              type: integer
              description: 'Number of requests that failed.

                '
          required:
          - total
          - completed
          - failed
        metadata:
          type: object
          nullable: true
          description: 'Set of 16 key-value pairs that can be attached to the batch. This can be useful
            for storing additional information about the batch in a structured format.

            '
          additionalProperties:
            type: string
      required:
      - id
      - object
      - endpoint
      - input_file_id
      - completion_window
      - status
      - created_at
      - request_counts
    CompanyBudgetLimit:
      type: object
      properties:
        company_uuid:
          type: string
          description: The UUID of the company.
        target_type:
          type: string
          description: The target type of the budget limit. Only team or user are supported for new limits.
          enum:
          - company
          - team
          - user
        target_uuid:
          type: string
          description: The UUID of the target (team or user).
        limit_type:
          type: string
          description: The type of budget limit.
          enum:
          - general
          - public-api
        is_renewed:
          type: boolean
          description: Whether the budget limit is renewed periodically.
        value:
          type: number
          format: double
          description: The budget limit value.
        created_at:
          type: string
          format: date-time
          description: When the budget limit was created.
        updated_at:
          type: string
          format: date-time
          description: When the budget limit was last updated.
      required:
      - company_uuid
      - target_type
      - target_uuid
      - limit_type
      - is_renewed
      - created_at
      - updated_at
    UpsertCompanyBudgetLimitRequest:
      type: object
      properties:
        target_type:
          type: string
          description: The target type of the budget limit (only team or user are supported).
          enum:
          - team
          - user
        target_uuid:
          type: string
          description: The UUID of the target (team or user). Empty string for default budget
        limit_type:
          type: string
          description: The type of budget limit.
          enum:
          - general
          - public-api
        is_renewed:
          type: boolean
          description: Whether the budget limit is renewed periodically.
        value:
          type: integer
          format: int64
          description: The budget limit value.
          nullable: true
      required:
      - target_type
      - target_uuid
      - limit_type
      - is_renewed
      - value
    DeleteCompanyBudgetLimitRequest:
      type: object
      properties:
        target_type:
          type: string
          description: The target type of the budget limit (only team or user are supported).
          enum:
          - team
          - user
        target_uuid:
          type: string
          description: The UUID of the target (team or user).
        limit_type:
          type: string
          description: The type of budget limit.
          enum:
          - general
          - public-api
      required:
      - target_type
      - limit_type
      - target_uuid
    BulkUpsertCompanyBudgetLimitRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BulkUpsertCompanyBudgetLimitItem'
      required:
      - items
    BulkUpsertCompanyBudgetLimitItem:
      type: object
      properties:
        target_type:
          type: string
          description: The target type of the budget limit (only team or user are supported).
          enum:
          - team
          - user
        target_uuid:
          type: string
          description: The UUID of the target (team or user). Empty string for default budget.
        limit_type:
          type: string
          description: The type of budget limit.
          enum:
          - general
          - public-api
        is_renewed:
          type: boolean
          description: Whether the budget limit is renewed periodically.
        value:
          type: integer
          format: int64
          description: The budget limit value. Ignored when remove is true.
        remove:
          type: boolean
          description: When true, the matching row is deleted instead of upserted.
      required:
      - target_type
      - target_uuid
      - limit_type
      - is_renewed
    ChatCompletionsRequest:
      type: object
      properties:
        messages:
          description: 'A list of messages comprising the conversation so far. Depending on the model
            you use, different message types (modalities) are supported, like text, images, and audio.

            '
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestMessage'
        model:
          type: string
          description: Model name, UUID, or agent UUID.
        store:
          type: boolean
          description: 'Whether or not to store the output of this chat completion request

            '
        metadata:
          type: object
          description: 'Developer-defined tags and values used for filtering completions

            in the dashboard.

            '
          additionalProperties:
            type: string
        frequency_penalty:
          type: number
          default: 0
          minimum: -2
          maximum: 2
          description: 'Number between -2.0 and 2.0. Positive values penalize new tokens based on their
            existing frequency in the text so far, decreasing the model''s likelihood to repeat the same
            line verbatim.

            '
        logit_bias:
          type: object
          additionalProperties:
            type: integer
          description: 'Modify the likelihood of specified tokens appearing in the completion.


            Accepts a JSON object that maps tokens (specified by their token ID in the tokenizer) to an
            associated bias value from -100 to 100. Mathematically, the bias is added to the logits generated
            by the model prior to sampling. The exact effect will vary per model, but values between -1
            and 1 should decrease or increase likelihood of selection; values like -100 or 100 should
            result in a ban or exclusive selection of the relevant token.

            '
        logprobs:
          description: Whether to return log probabilities of the output tokens or not. If true, returns
            the log probabilities of each output token returned in the `content` of `message`.
          type: boolean
        top_logprobs:
          description: An integer between 0 and 20 specifying the number of most likely tokens to return
            at each token position, each with an associated log probability. `logprobs` must be set to
            `true` if this parameter is used.
          type: integer
          minimum: 0
          maximum: 20
        max_tokens:
          description: 'The maximum number of tokens that can be generated in the chat completion. This
            value can be used to control costs for text generated via API.


            This value is now deprecated in favor of `max_completion_tokens`, and is not compatible with
            o1 series models.

            '
          type: integer
          nullable: true
          deprecated: true
        max_completion_tokens:
          description: 'An upper bound for the number of tokens that can be generated for a completion,
            including visible output tokens and reasoning tokens.

            '
          type: integer
          nullable: true
        n:
          type: integer
          minimum: 1
          maximum: 128
          default: 1
          description: How many chat completion choices to generate for each input message. Note that
            you will be charged based on the number of generated tokens across all of the choices. Keep
            `n` as `1` to minimize costs.
        modalities:
          $ref: '#/components/schemas/ChatCompletionModalities'
        prediction:
          description: 'Configuration for a Predicted Output,

            which can greatly improve response times when large parts of the model

            response are known ahead of time. This is most common when you are

            regenerating a file with only minor changes to most of the content.

            '
          oneOf:
          - $ref: '#/components/schemas/PredictionContent'
        audio:
          type: object
          description: 'Parameters for audio output. Required when audio output is requested with

            `modalities: ["audio"]`.

            '
          required:
          - voice
          - format
          properties:
            voice:
              type: string
              enum:
              - alloy
              - ash
              - ballad
              - coral
              - echo
              - sage
              - shimmer
              - verse
              description: 'The voice the model uses to respond. Supported voices are `alloy`,

                `ash`, `ballad`, `coral`, `echo`, `sage`, `shimmer`, and `verse`.

                '
            format:
              type: string
              enum:
              - wav
              - mp3
              - flac
              - opus
              - pcm16
              description: 'Specifies the output audio format. Must be one of `wav`, `mp3`, `flac`,

                `opus`, or `pcm16`.

                '
        presence_penalty:
          type: number
          default: 0
          minimum: -2
          maximum: 2
          description: 'Number between -2.0 and 2.0. Positive values penalize new tokens based on whether
            they appear in the text so far, increasing the model''s likelihood to talk about new topics.

            '
        response_format:
          description: 'An object specifying the format that the model must output. Compatible with GPT-4o,
            GPT-4o mini, GPT-4 Turbo and all GPT-3.5 Turbo models newer than `gpt-3.5-turbo-1106`.


            Setting to `{ "type": "json_schema", "json_schema": {...} }` enables Structured Outputs which
            ensures the model will match your supplied JSON schema.


            Setting to `{ "type": "json_object" }` enables JSON mode, which ensures the message the model
            generates is valid JSON.


            **Important:** when using JSON mode, you **must** also instruct the model to produce JSON
            yourself via a system or user message. Without this, the model may generate an unending stream
            of whitespace until the generation reaches the token limit, resulting in a long-running and
            seemingly "stuck" request. Also note that the message content may be partially cut off if
            `finish_reason="length"`, which indicates the generation exceeded `max_tokens` or the conversation
            exceeded the max context length.

            '
          oneOf:
          - $ref: '#/components/schemas/ResponseFormatText'
          - $ref: '#/components/schemas/ResponseFormatJsonObject'
          - $ref: '#/components/schemas/ResponseFormatJsonSchema'
        seed:
          type: integer
          minimum: -9223372036854776000
          maximum: 9223372036854776000
          description: 'This feature is in Beta.

            If specified, our system will make a best effort to sample deterministically, such that repeated
            requests with the same `seed` and parameters should return the same result.

            Determinism is not guaranteed, and you should refer to the `system_fingerprint` response parameter
            to monitor changes in the backend.

            '
        service_tier:
          description: 'Specifies the processing type used for serving the request.

            If set to ''default'' or ''auto'', then the request will be processed with the standard pricing
            and performance for the selected model.

            If set to ''flex'' or ''priority'', then the request will be processed with the corresponding
            service tier.

            When not set, the default behavior is ''auto''.

            When the `service_tier` parameter is set, the response body will include the `service_tier`
            value based on the processing mode actually used to serve the request. This response value
            may be different from the value set in the parameter.

            '
          type: string
          enum:
          - auto
          - default
          - flex
          - scale
          - priority
          default: auto
        stop:
          description: 'Up to 4 sequences where the API will stop generating further tokens.

            '
          oneOf:
          - type: string
          - type: array
            minItems: 1
            maxItems: 4
            items:
              type: string
        stream:
          description: 'If set, partial message deltas will be sent, like in ChatGPT. Tokens will be sent
            as data-only [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format)
            as they become available, with the stream terminated by a `data: [DONE]` message.

            '
          type: boolean
        stream_options:
          $ref: '#/components/schemas/ChatCompletionStreamOptions'
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
          description: 'What sampling temperature to use, between 0 and 2. Higher values like 0.8 will
            make the output more random, while lower values like 0.2 will make it more focused and deterministic.


            We generally recommend altering this or `top_p` but not both.

            '
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 1
          description: 'An alternative to sampling with temperature, called nucleus sampling, where the
            model considers the results of the tokens with top_p probability mass. So 0.1 means only the
            tokens comprising the top 10% probability mass are considered.


            We generally recommend altering this or `temperature` but not both.

            '
        tools:
          type: array
          description: 'A list of tools the model may call. Currently, only functions are supported as
            a tool. Use this to provide a list of functions the model may generate JSON inputs for. A
            max of 128 functions are supported.

            '
          items:
            $ref: '#/components/schemas/ChatCompletionTool'
        tool_choice:
          $ref: '#/components/schemas/ChatCompletionToolChoiceOption'
        parallel_tool_calls:
          $ref: '#/components/schemas/ParallelToolCalls'
        function_call:
          deprecated: true
          description: 'Deprecated in favor of `tool_choice`.


            Controls which (if any) function is called by the model.

            `none` means the model will not call a function and instead generates a message.

            `auto` means the model can pick between generating a message or calling a function.

            Specifying a particular function via `{"name": "my_function"}` forces the model to call that
            function.


            `none` is the default when no functions are present. `auto` is the default if functions are
            present.

            '
          oneOf:
          - type: string
            description: '`none` means the model will not call a function and instead generates a message.
              `auto` means the model can pick between generating a message or calling a function.

              '
            enum:
            - none
            - auto
          - $ref: '#/components/schemas/ChatCompletionFunctionCallOption'
        functions:
          deprecated: true
          description: 'Deprecated in favor of `tools`.


            A list of functions the model may generate JSON inputs for.

            '
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/ChatCompletionFunctions'
        thinking:
          type: object
          properties:
            type:
              type: string
              description: The type of thinking configuration
            budget_tokens:
              type: integer
              description: The token budget allocation for thinking operations
        reasoning_effort:
          type: string
          description: Reasoning effort for models that support reasoning.
          enum:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        verbosity:
          type: string
          description: Constrains the verbosity of the model's response.
          enum:
          - low
          - medium
          - high
      required:
      - model
      - messages
    chat_completions_messages_ChatCompletionRequestMessage:
      oneOf:
      - $ref: '#/components/schemas/ChatCompletionRequestDeveloperMessage'
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestSystemMessage'
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestUserMessage'
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestAssistantMessage'
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestToolMessage'
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestFunctionMessage'
    ChatCompletionRequestDeveloperMessage:
      type: object
      title: Developer message
      description: 'Developer-provided instructions that the model should follow, regardless of

        messages sent by the user. With o1 models and newer, `developer` messages

        replace the previous `system` messages.

        '
      properties:
        content:
          description: The contents of the developer message.
          oneOf:
          - type: string
            description: The contents of the developer message.
            title: Text content
          - type: array
            description: An array of content parts with a defined type. For developer messages, only type
              `text` is supported.
            title: Array of content parts
            items:
              $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestMessageContentPartText'
            minItems: 1
        role:
          type: string
          enum:
          - developer
          description: The role of the messages author, in this case `developer`.
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate
            between participants of the same role.
      required:
      - content
      - role
    chat_completions_messages_ChatCompletionRequestMessageContentPartText:
      type: object
      title: Text content part
      description: 'Learn about [text inputs](/docs/guides/text-generation).

        '
      properties:
        type:
          type: string
          enum:
          - text
          description: The type of the content part.
        text:
          type: string
          description: The text content.
      required:
      - type
      - text
    chat_completions_messages_ChatCompletionRequestSystemMessage:
      type: object
      title: System message
      description: 'Developer-provided instructions that the model should follow, regardless of

        messages sent by the user. With o1 models and newer, use `developer` messages

        for this purpose instead.

        '
      properties:
        content:
          description: The contents of the system message.
          oneOf:
          - type: string
            description: The contents of the system message.
            title: Text content
          - type: array
            description: An array of content parts with a defined type. For system messages, only type
              `text` is supported.
            title: Array of content parts
            items:
              $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestSystemMessageContentPart'
            minItems: 1
        role:
          type: string
          enum:
          - system
          description: The role of the messages author, in this case `system`.
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate
            between participants of the same role.
      required:
      - content
      - role
    chat_completions_messages_ChatCompletionRequestSystemMessageContentPart:
      oneOf:
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestMessageContentPartText'
    chat_completions_messages_ChatCompletionRequestUserMessage:
      type: object
      title: User message
      description: 'Messages sent by an end user, containing prompts or additional context

        information.

        '
      properties:
        content:
          description: 'The contents of the user message.

            '
          oneOf:
          - type: string
            description: The text contents of the message.
            title: Text content
          - type: array
            description: An array of content parts with a defined type. Supported options differ based
              on the [model](/docs/models) being used to generate the response. Can contain text, image,
              or audio inputs.
            title: Array of content parts
            items:
              $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestUserMessageContentPart'
            minItems: 1
        role:
          type: string
          enum:
          - user
          description: The role of the messages author, in this case `user`.
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate
            between participants of the same role.
      required:
      - content
      - role
    chat_completions_messages_ChatCompletionRequestUserMessageContentPart:
      oneOf:
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestMessageContentPartText'
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestMessageContentPartImage'
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestMessageContentPartAudio'
    chat_completions_messages_ChatCompletionRequestMessageContentPartImage:
      type: object
      title: Image content part
      description: 'Learn about [image inputs](/docs/guides/vision).

        '
      properties:
        type:
          type: string
          enum:
          - image_url
          description: The type of the content part.
        image_url:
          type: object
          properties:
            url:
              type: string
              description: Either a URL of the image or the base64 encoded image data.
              format: uri
            detail:
              type: string
              description: Specifies the detail level of the image. Learn more in the [Vision guide](/docs/guides/vision#low-or-high-fidelity-image-understanding).
              enum:
              - auto
              - low
              - high
              default: auto
          required:
          - url
      required:
      - type
      - image_url
    chat_completions_messages_ChatCompletionRequestMessageContentPartAudio:
      type: object
      title: Audio content part
      description: 'Learn about [audio inputs](/docs/guides/audio).

        '
      properties:
        type:
          type: string
          enum:
          - input_audio
          description: The type of the content part. Always `input_audio`.
        input_audio:
          type: object
          properties:
            data:
              type: string
              description: Base64 encoded audio data.
            format:
              type: string
              enum:
              - wav
              - mp3
              description: 'The format of the encoded audio data. Currently supports "wav" and "mp3".

                '
          required:
          - data
          - format
      required:
      - type
      - input_audio
    chat_completions_messages_ChatCompletionRequestAssistantMessage:
      type: object
      title: Assistant message
      description: 'Messages sent by the model in response to user messages.

        '
      properties:
        content:
          nullable: true
          oneOf:
          - type: string
            description: The contents of the assistant message.
            title: Text content
          - type: array
            description: An array of content parts with a defined type. Can be one or more of type `text`,
              or exactly one of type `refusal`.
            title: Array of content parts
            items:
              $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestAssistantMessageContentPart'
            minItems: 1
          description: 'The contents of the assistant message. Required unless `tool_calls` or `function_call`
            is specified.

            '
        refusal:
          nullable: true
          type: string
          description: The refusal message by the assistant.
        role:
          type: string
          enum:
          - assistant
          description: The role of the messages author, in this case `assistant`.
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate
            between participants of the same role.
        audio:
          type: object
          nullable: true
          description: "Data about a previous audio response from the model. \n[Learn more](/docs/guides/audio).\n"
          required:
          - id
          properties:
            id:
              type: string
              description: 'Unique identifier for a previous audio response from the model.

                '
        tool_calls:
          $ref: '#/components/schemas/chat_completions_messages_ChatCompletionMessageToolCalls'
        function_call:
          type: object
          deprecated: true
          description: Deprecated and replaced by `tool_calls`. The name and arguments of a function that
            should be called, as generated by the model.
          nullable: true
          properties:
            arguments:
              type: string
              description: The arguments to call the function with, as generated by the model in JSON
                format. Note that the model does not always generate valid JSON, and may hallucinate parameters
                not defined by your function schema. Validate the arguments in your code before calling
                your function.
            name:
              type: string
              description: The name of the function to call.
          required:
          - arguments
          - name
      required:
      - role
    chat_completions_messages_ChatCompletionRequestAssistantMessageContentPart:
      oneOf:
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestMessageContentPartText'
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestMessageContentPartRefusal'
    chat_completions_messages_ChatCompletionRequestMessageContentPartRefusal:
      type: object
      title: Refusal content part
      properties:
        type:
          type: string
          enum:
          - refusal
          description: The type of the content part.
        refusal:
          type: string
          description: The refusal message generated by the model.
      required:
      - type
      - refusal
    chat_completions_messages_ChatCompletionMessageToolCalls:
      type: array
      description: The tool calls generated by the model, such as function calls.
      items:
        $ref: '#/components/schemas/chat_completions_messages_ChatCompletionMessageToolCall'
    chat_completions_messages_ChatCompletionMessageToolCall:
      type: object
      properties:
        id:
          type: string
          description: The ID of the tool call.
        type:
          type: string
          enum:
          - function
          description: The type of the tool. Currently, only `function` is supported.
        function:
          type: object
          description: The function that the model called.
          properties:
            name:
              type: string
              description: The name of the function to call.
            arguments:
              type: string
              description: The arguments to call the function with, as generated by the model in JSON
                format. Note that the model does not always generate valid JSON, and may hallucinate parameters
                not defined by your function schema. Validate the arguments in your code before calling
                your function.
          required:
          - name
          - arguments
      required:
      - id
      - type
      - function
    chat_completions_messages_ChatCompletionRequestToolMessage:
      type: object
      title: Tool message
      properties:
        role:
          type: string
          enum:
          - tool
          description: The role of the messages author, in this case `tool`.
        content:
          oneOf:
          - type: string
            description: The contents of the tool message.
            title: Text content
          - type: array
            description: An array of content parts with a defined type. For tool messages, only type `text`
              is supported.
            title: Array of content parts
            items:
              $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestToolMessageContentPart'
            minItems: 1
          description: The contents of the tool message.
        tool_call_id:
          type: string
          description: Tool call that this message is responding to.
      required:
      - role
      - content
      - tool_call_id
    chat_completions_messages_ChatCompletionRequestToolMessageContentPart:
      oneOf:
      - $ref: '#/components/schemas/chat_completions_messages_ChatCompletionRequestMessageContentPartText'
    chat_completions_messages_ChatCompletionRequestFunctionMessage:
      type: object
      title: Function message
      deprecated: true
      properties:
        role:
          type: string
          enum:
          - function
          description: The role of the messages author, in this case `function`.
        content:
          nullable: true
          type: string
          description: The contents of the function message.
        name:
          type: string
          description: The name of the function to call.
      required:
      - role
      - content
      - name
    ChatCompletionModalities:
      type: array
      description: 'Output types that you would like the model to generate for this request.

        Most models are capable of generating text, which is the default:


        `["text"]`


        To request that this model generate both text and audio responses, you can use:


        `["text", "audio"]`

        '
      items:
        type: string
        enum:
        - text
        - audio
    PredictionContent:
      type: object
      title: Static Content
      description: 'Static predicted output content, such as the content of a text file that is being
        regenerated.

        '
      required:
      - type
      - content
      properties:
        type:
          type: string
          enum:
          - content
          description: 'The type of the predicted content you want to provide. This type is

            currently always `content`.

            '
        content:
          description: 'The content that should be matched when generating a model response.

            If generated tokens would match this content, the entire model response

            can be returned much more quickly.

            '
          oneOf:
          - type: string
            title: Text content
            description: 'The content used for a Predicted Output. This is often the

              text of a file you are regenerating with minor changes.

              '
          - type: array
            description: An array of content parts with a defined type. Supported options differ based
              on the [model](/docs/models) being used to generate the response. Can contain text inputs.
            title: Array of content parts
            items:
              $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartText'
            minItems: 1
    ChatCompletionRequestMessageContentPartText:
      type: object
      title: Text content part
      properties:
        type:
          type: string
          enum:
          - text
          description: The type of the content part.
        text:
          type: string
          description: The text content.
      required:
      - type
      - text
    ResponseFormatText:
      type: object
      properties:
        type:
          type: string
          description: 'The type of response format being defined: `text`'
          enum:
          - text
      required:
      - type
    ResponseFormatJsonObject:
      type: object
      properties:
        type:
          type: string
          description: 'The type of response format being defined: `json_object`'
          enum:
          - json_object
      required:
      - type
    ResponseFormatJsonSchema:
      type: object
      properties:
        type:
          type: string
          description: 'The type of response format being defined: `json_schema`'
          enum:
          - json_schema
        json_schema:
          type: object
          properties:
            description:
              type: string
              description: A description of what the response format is for, used by the model to determine
                how to respond in the format.
            name:
              type: string
              description: The name of the response format. Must be a-z, A-Z, 0-9, or contain underscores
                and dashes, with a maximum length of 64.
            schema:
              $ref: '#/components/schemas/ResponseFormatJsonSchemaSchema'
            strict:
              type: boolean
              nullable: true
              default: false
              description: Whether to enable strict schema adherence when generating the output. If set
                to true, the model will always follow the exact schema defined in the `schema` field.
                Only a subset of JSON Schema is supported when `strict` is `true`. To learn more, read
                the [Structured Outputs guide](/docs/guides/structured-outputs).
          required:
          - type
          - name
      required:
      - type
      - json_schema
    ResponseFormatJsonSchemaSchema:
      type: object
      description: The schema for the response format, described as a JSON Schema object.
      additionalProperties: true
    ChatCompletionStreamOptions:
      description: 'Options for streaming response. Only set this when you set `stream: true`.

        '
      type: object
      properties:
        include_usage:
          type: boolean
          description: 'If set, an additional chunk will be streamed before the `data: [DONE]` message.
            The `usage` field on this chunk shows the token usage statistics for the entire request, and
            the `choices` field will always be an empty array. All other chunks will also include a `usage`
            field, but with a null value

            '
    ChatCompletionTool:
      type: object
      properties:
        type:
          type: string
          enum:
          - function
          - web_search
          - rag
          - tika_ocr
          description: The type of the tool. Supports `function`, `web_search`, `rag` and `tika_ocr`.
        function:
          $ref: '#/components/schemas/FunctionObject'
        web_search:
          $ref: '#/components/schemas/ChatCompletionWebSearch'
        rag:
          $ref: '#/components/schemas/ChatCompletionRAG'
        tika_ocr:
          $ref: '#/components/schemas/ChatCompletionTikaOCR'
      required:
      - type
    FunctionObject:
      type: object
      properties:
        description:
          type: string
          description: A description of what the function does, used by the model to choose when and how
            to call the function.
        name:
          type: string
          description: The name of the function to be called. Must be a-z, A-Z, 0-9, or contain underscores
            and dashes, with a maximum length of 64.
        parameters:
          $ref: '#/components/schemas/FunctionParameters'
        strict:
          type: boolean
          nullable: true
          default: false
          description: Whether to enable strict schema adherence when generating the function call. If
            set to true, the model will follow the exact schema defined in the `parameters` field. Only
            a subset of JSON Schema is supported when `strict` is `true`.
      required:
      - name
    FunctionParameters:
      type: object
      description: 'The parameters the functions accepts, described as a JSON Schema object.

        Omitting `parameters` defines a function with an empty parameter list.'
      additionalProperties: true
    ChatCompletionWebSearch:
      type: object
      description: The web search that the model called.
      properties:
        search_context_size:
          type: string
          description: High level guidance for the amount of context window space to use for the search.
          enum:
          - low
          - medium
          - high
        user_location:
          $ref: '#/components/schemas/UserLocation'
        mcp:
          $ref: '#/components/schemas/WebSearchMCP'
    UserLocation:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: The type of location approximation.
          enum:
          - approximate
        city:
          type: string
          description: The city to use for the location approximation.
        country:
          type: string
          description: The two-letter ISO country code of the user.
        region:
          type: string
          description: Free text input for the region of the user.
        timezone:
          type: string
          description: The IANA timezone of the user.
    WebSearchMCP:
      type: object
      description: Custom MCP web_search
      required:
      - type
      - options`
      properties:
        type:
          type: string
          description: The type of the web search.
          enum:
          - url
          - query
        options:
          oneOf:
          - $ref: '#/components/schemas/QuerySearch'
          - $ref: '#/components/schemas/URLSearch'
    QuerySearch:
      type: object
      required:
      - tool
      - query
      properties:
        tool:
          type: string
          description: The type of tool used for web search.
          enum:
          - google_search
          - bing_search
          - amazon_search
        query:
          type: string
          description: The query to search for.
        geo_location:
          type: string
          description: The geographic location to use for the search.
        parse:
          type: boolean
          description: Whether to parse the search results.
          default: false
    URLSearch:
      type: object
      required:
      - tool
      - url
      properties:
        tool:
          type: string
          description: The type of the web search.
          enum:
          - universal
        url:
          type: string
          description: The URL to search for.
        geo_location:
          type: string
          description: The geographic location to use for the search.
        parse:
          type: boolean
          description: Whether to parse the search results.
          default: false
    ChatCompletionRAG:
      type: object
      description: RAG tool call
      properties:
        mcp:
          $ref: '#/components/schemas/RagMCP'
    RagMCP:
      type: object
      description: RAG MCP tool call
      required:
      - collection_uuid
      properties:
        collection_uuid:
          type: string
          description: The UUID of the collection to search.
        query:
          type: string
          description: The query to search for.
        threshold:
          type: number
          format: float
          description: The threshold for the search results.
        top_n:
          type: integer
          description: The number of top results to return.
        model_uuid:
          type: string
          description: The UUID of the model to use for the search.
    ChatCompletionTikaOCR:
      type: object
      description: Tika OCR that the model called.
      properties:
        file_id:
          type: string
      required:
      - file_id
    ChatCompletionToolChoiceOption:
      description: 'Controls which (if any) tool is called by the model.

        `none` means the model will not call any tool and instead generates a message.

        `auto` means the model can pick between generating a message or calling one or more tools.

        `required` means the model must call one or more tools.

        Specifying a particular tool via `{"type": "function", "function": {"name": "my_function"}}` forces
        the model to call that tool.


        `none` is the default when no tools are present. `auto` is the default if tools are present.

        '
      oneOf:
      - type: string
        description: '`none` means the model will not call any tool and instead generates a message. `auto`
          means the model can pick between generating a message or calling one or more tools. `required`
          means the model must call one or more tools.

          '
        enum:
        - none
        - auto
        - required
      - $ref: '#/components/schemas/ChatCompletionNamedToolChoice'
    ChatCompletionNamedToolChoice:
      type: object
      description: Specifies a tool the model should use. Use to force the model to call a specific function.
      properties:
        type:
          type: string
          enum:
          - function
          description: The type of the tool. Currently, only `function` is supported.
        function:
          type: object
          properties:
            name:
              type: string
              description: The name of the function to call.
          required:
          - name
      required:
      - type
      - function
    ParallelToolCalls:
      description: Whether to enable parallel function calling during tool use.
      type: boolean
      default: true
    ChatCompletionFunctionCallOption:
      type: object
      description: 'Specifying a particular function via `{"name": "my_function"}` forces the model to
        call that function.

        '
      properties:
        name:
          type: string
          description: The name of the function to call.
      required:
      - name
    ChatCompletionFunctions:
      type: object
      properties:
        description:
          type: string
          description: A description of what the function does, used by the model to choose when and how
            to call the function.
        name:
          type: string
          description: The name of the function to be called. Must be a-z, A-Z, 0-9, or contain underscores
            and dashes, with a maximum length of 64.
        parameters:
          $ref: '#/components/schemas/FunctionParameters'
      required:
      - name
    ChatCompletionFinishReason:
      type: string
      description: 'The reason the model stopped generating tokens. This will be `stop` if the model hit
        a natural stop point or a provided stop sequence,

        `length` if the maximum number of tokens specified in the request was reached,

        `content_filter` if content was omitted due to a flag from our content filters,

        `tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called a
        function.

        '
      enum:
      - stop
      - length
      - tool_calls
      - content_filter
      - function_call
    ChatCompletionResponseMessage:
      type: object
      description: A chat completion message generated by the model.
      properties:
        content:
          type: string
          description: The contents of the message.
          nullable: true
        refusal:
          type: string
          description: The refusal message generated by the model.
          nullable: true
        tool_calls:
          $ref: '#/components/schemas/ChatCompletionMessageToolCalls'
        role:
          type: string
          enum:
          - assistant
          description: The role of the author of this message.
        function_call:
          type: object
          deprecated: true
          description: Deprecated and replaced by `tool_calls`. The name and arguments of a function that
            should be called, as generated by the model.
          properties:
            arguments:
              type: string
              description: The arguments to call the function with, as generated by the model in JSON
                format. Note that the model does not always generate valid JSON, and may hallucinate parameters
                not defined by your function schema. Validate the arguments in your code before calling
                your function.
            name:
              type: string
              description: The name of the function to call.
          required:
          - name
          - arguments
        audio:
          type: object
          nullable: true
          description: 'If the audio output modality is requested, this object contains data

            about the audio response from the model. [Learn more](/docs/guides/audio).

            '
          required:
          - id
          - expires_at
          - data
          - transcript
          properties:
            id:
              type: string
              description: Unique identifier for this audio response.
            expires_at:
              type: integer
              description: 'The Unix timestamp (in seconds) for when this audio response will no longer
                be accessible on the server for use in multi-turn conversations.

                '
            data:
              type: string
              description: 'Base64 encoded audio bytes generated by the model, in the format

                specified in the request.

                '
            transcript:
              type: string
              description: Transcript of the audio generated by the model.
        annotations:
          type: array
          description: Annotations for the message, when applicable, as when using the web search tool.
          items:
            $ref: '#/components/schemas/Annotation'
      required:
      - role
      - content
      - refusal
    ChatCompletionMessageToolCalls:
      type: array
      description: The tool calls generated by the model, such as function calls.
      items:
        $ref: '#/components/schemas/ChatCompletionMessageToolCall'
    ChatCompletionMessageToolCall:
      type: object
      properties:
        id:
          type: string
          description: The ID of the tool call.
        type:
          type: string
          enum:
          - function
          description: The type of the tool. Currently, only `function` is supported.
        function:
          type: object
          description: The function that the model called.
          properties:
            name:
              type: string
              description: The name of the function to call.
            arguments:
              type: string
              description: The arguments to call the function with, as generated by the model in JSON
                format. Note that the model does not always generate valid JSON, and may hallucinate parameters
                not defined by your function schema. Validate the arguments in your code before calling
                your function.
          required:
          - name
          - arguments
      required:
      - id
      - type
      - function
    Annotation:
      type: object
      properties:
        type:
          type: string
          description: The type of the URL citation. Always url_citation.
        url_citation:
          $ref: '#/components/schemas/URLCitation'
    URLCitation:
      type: object
      description: A URL citation when using web search.
      properties:
        end_index:
          type: integer
          description: The index of the last character of the URL citation in the message.
        start_index:
          type: integer
          description: The index of the first character of the URL citation in the message.
        title:
          type: string
          description: The title of the web resource.
        url:
          type: string
          description: The URL of the web resource.
    ChatCompletionTokenLogprob:
      type: object
      properties:
        token:
          description: The token.
          type: string
        logprob:
          description: 'The log probability of this token, if it is within the top 20 most likely tokens.
            Otherwise, the value `-9999.0` is used to signify that the token is very unlikely.

            '
          type: number
        bytes:
          description: 'A list of integers representing the UTF-8 bytes representation of the token. Useful
            in instances where characters are represented by multiple tokens and their byte representations
            must be combined to generate the correct text representation. Can be `null` if there is no
            bytes representation for the token.

            '
          type: array
          items:
            type: integer
          nullable: true
        top_logprobs:
          description: 'List of the most likely tokens and their log probability, at this token position.
            In rare cases, there may be fewer than the number of requested `top_logprobs` returned.

            '
          type: array
          items:
            type: object
            properties:
              token:
                description: The token.
                type: string
              logprob:
                description: 'The log probability of this token, if it is within the top 20 most likely
                  tokens. Otherwise, the value `-9999.0` is used to signify that the token is very unlikely.

                  '
                type: number
              bytes:
                description: 'A list of integers representing the UTF-8 bytes representation of the token.
                  Useful in instances where characters are represented by multiple tokens and their byte
                  representations must be combined to generate the correct text representation. Can be
                  `null` if there is no bytes representation for the token.

                  '
                type: array
                items:
                  type: integer
                nullable: true
            required:
            - token
            - logprob
            - bytes
      required:
      - token
      - logprob
      - bytes
      - top_logprobs
    ChatCompletionServiceTier:
      description: 'The service tier used for processing the request. This field is only included if the
        `service_tier` parameter is specified in the request. The value may differ from the `service_tier`
        parameter sent in the request. For example, if ''auto'' is specified, the response will return
        ''default'' as they are equivalent.

        '
      type: string
      enum:
      - auto
      - default
      - flex
      - scale
      - priority
      nullable: true
    ChatCompletionObject:
      type: string
      description: The object type, which is always `chat.completion`.
      enum:
      - chat.completion
    CompletionUsage:
      type: object
      description: Usage statistics for the completion request.
      properties:
        completion_tokens:
          type: integer
          description: Number of tokens in the generated completion.
        prompt_tokens:
          type: integer
          description: Number of tokens in the prompt.
        total_tokens:
          type: integer
          description: Total number of tokens used in the request (prompt + completion).
        nexos_credits_cost:
          type: number
          format: double
          description: Cost of the request in nexos credits.
        completion_tokens_details:
          type: object
          description: Breakdown of tokens used in a completion.
          properties:
            accepted_prediction_tokens:
              type: integer
              description: 'When using Predicted Outputs, the number of tokens in the

                prediction that appeared in the completion.

                '
            audio_tokens:
              type: integer
              description: Audio input tokens generated by the model.
            reasoning_tokens:
              type: integer
              description: Tokens generated by the model for reasoning.
            rejected_prediction_tokens:
              type: integer
              description: 'When using Predicted Outputs, the number of tokens in the prediction that
                did not appear in the completion. However, like reasoning tokens, these tokens are still
                counted in the total completion tokens for purposes of billing, output, and context window
                limits.

                '
        prompt_tokens_details:
          type: object
          description: Breakdown of tokens used in the prompt.
          properties:
            audio_tokens:
              type: integer
              description: Audio input tokens present in the prompt.
            cached_tokens:
              type: integer
              description: Cached tokens present in the prompt.
      required:
      - prompt_tokens
      - completion_tokens
      - total_tokens
