    ResponsePromptVariables:
      type: object
      title: Prompt Variables
      description: 'Optional map of values to substitute in for variables in your

        prompt. The substitution values can either be strings, or other

        Response input types like images or files.

        '
      additionalProperties:
        anyOf:
        - type: string
        - $ref: '#/components/schemas/InputTextContent'
        - $ref: '#/components/schemas/InputImageContent'
        - $ref: '#/components/schemas/InputFileContent'
      nullable: true
    InputTextContent:
      properties:
        type:
          type: string
          enum:
          - input_text
          description: The type of the input item. Always `input_text`.
          default: input_text
        text:
          type: string
          description: The text input to the model.
      type: object
      required:
      - type
      - text
      title: Input text
      description: A text input to the model.
    InputImageContent:
      properties:
        type:
          type: string
          enum:
          - input_image
          description: The type of the input item. Always `input_image`.
          default: input_image
        image_url:
          type: string
          nullable: true
          description: The URL of the image to be sent to the model. A fully qualified URL or base64 encoded
            image in a data URL.
        file_id:
          type: string
          nullable: true
          description: The ID of the file to be sent to the model.
        detail:
          $ref: '#/components/schemas/ImageDetail'
          description: The detail level of the image to be sent to the model. One of `high`, `low`, or
            `auto`. Defaults to `auto`.
      type: object
      required:
      - type
      - detail
      title: Input image
      description: An image input to the model. See the vision guide for details.
    ImageDetail:
      type: string
      enum:
      - low
      - high
      - auto
    InputFileContent:
      properties:
        type:
          type: string
          enum:
          - input_file
          description: The type of the input item. Always `input_file`.
          default: input_file
        file_id:
          type: string
          nullable: true
          description: The ID of the file to be sent to the model.
        filename:
          type: string
          description: The name of the file to be sent to the model.
        file_url:
          type: string
          description: The URL of the file to be sent to the model.
        file_data:
          type: string
          description: 'The content of the file to be sent to the model.

            '
      type: object
      required:
      - type
      title: Input file
      description: A file input to the model.
    InputParam:
      description: 'Text, image, or file inputs used to generate a response.

        Use this to provide content the model should consider.

        '
      anyOf:
      - type: string
        title: Text input
        description: 'A text input to the model, equivalent to a text input with the

          `user` role.

          '
      - type: array
        title: Input item list
        description: 'A list of one or many input items to the model, containing

          different content types.

          '
        items:
          $ref: '#/components/schemas/InputItem'
    InputItem:
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          description: The type of the input item.
      required:
      - type
      anyOf:
      - $ref: '#/components/schemas/EasyInputMessage'
      - $ref: '#/components/schemas/Item'
      - $ref: '#/components/schemas/ItemReferenceParam'
    EasyInputMessage:
      type: object
      title: Input message
      description: 'A message input to the model with a role indicating instruction following

        hierarchy. Instructions given with the `developer` or `system` role take

        precedence over instructions given with the `user` role. Messages with the

        `assistant` role are presumed to have been generated by the model in previous

        interactions.

        '
      properties:
        role:
          type: string
          description: 'The role of the message input. One of `user`, `assistant`, `system`, or

            `developer`.

            '
          enum:
          - user
          - assistant
          - system
          - developer
        content:
          description: 'Text, image, or audio input to the model, used to generate a response.

            Can also contain previous assistant responses.

            '
          anyOf:
          - type: string
            title: Text input
            description: 'A text input to the model.

              '
          - $ref: '#/components/schemas/InputMessageContentList'
        type:
          type: string
          description: 'The type of the message input. Always `message`.

            '
          enum:
          - message
          default: message
      required:
      - role
      - content
    InputMessageContentList:
      type: array
      title: Input item content list
      description: "A list of one or many input items to the model, containing different content \ntypes.\n"
      items:
        $ref: '#/components/schemas/InputContent'
    InputContent:
      discriminator:
        propertyName: type
      anyOf:
      - $ref: '#/components/schemas/InputTextContent'
      - $ref: '#/components/schemas/InputImageContent'
      - $ref: '#/components/schemas/InputFileContent'
    Item:
      type: object
      description: 'Content item used to generate a response.

        '
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          description: The type of the input item.
      required:
      - type
      anyOf:
      - $ref: '#/components/schemas/responses_InputMessage'
      - $ref: '#/components/schemas/OutputMessage'
      - $ref: '#/components/schemas/FileSearchToolCall'
      - $ref: '#/components/schemas/ComputerToolCall'
      - $ref: '#/components/schemas/ComputerCallOutputItemParam'
      - $ref: '#/components/schemas/WebSearchToolCall'
      - $ref: '#/components/schemas/FunctionToolCall'
      - $ref: '#/components/schemas/FunctionCallOutputItemParam'
      - $ref: '#/components/schemas/ReasoningItem'
      - $ref: '#/components/schemas/CompactionSummaryItemParam'
      - $ref: '#/components/schemas/ImageGenToolCall'
      - $ref: '#/components/schemas/CodeInterpreterToolCall'
      - $ref: '#/components/schemas/LocalShellToolCall'
      - $ref: '#/components/schemas/LocalShellToolCallOutput'
      - $ref: '#/components/schemas/FunctionShellCallItemParam'
      - $ref: '#/components/schemas/FunctionShellCallOutputItemParam'
      - $ref: '#/components/schemas/ApplyPatchToolCallItemParam'
      - $ref: '#/components/schemas/ApplyPatchToolCallOutputItemParam'
      - $ref: '#/components/schemas/MCPListTools'
      - $ref: '#/components/schemas/MCPApprovalRequest'
      - $ref: '#/components/schemas/MCPApprovalResponse'
      - $ref: '#/components/schemas/MCPToolCall'
      - $ref: '#/components/schemas/CustomToolCallOutput'
      - $ref: '#/components/schemas/CustomToolCall'
    responses_InputMessage:
      type: object
      title: Input message
      description: 'A message input to the model with a role indicating instruction following

        hierarchy. Instructions given with the `developer` or `system` role take

        precedence over instructions given with the `user` role.

        '
      properties:
        type:
          type: string
          description: 'The type of the message input. Always set to `message`.

            '
          enum:
          - message
          default: message
        role:
          type: string
          description: 'The role of the message input. One of `user`, `system`, or `developer`.

            '
          enum:
          - user
          - system
          - developer
        status:
          type: string
          description: 'The status of item. One of `in_progress`, `completed`, or

            `incomplete`. Populated when items are returned via API.

            '
          enum:
          - in_progress
          - completed
          - incomplete
        content:
          $ref: '#/components/schemas/InputMessageContentList'
      required:
      - role
      - content
    OutputMessage:
      type: object
      title: Output message
      description: 'An output message from the model.

        '
      properties:
        id:
          type: string
          description: 'The unique ID of the output message.

            '
        type:
          type: string
          description: 'The type of the output message. Always `message`.

            '
          enum:
          - message
          default: message
        role:
          type: string
          description: 'The role of the output message. Always `assistant`.

            '
          enum:
          - assistant
        content:
          type: array
          description: 'The content of the output message.

            '
          items:
            $ref: '#/components/schemas/OutputMessageContent'
        status:
          type: string
          description: 'The status of the message input. One of `in_progress`, `completed`, or

            `incomplete`. Populated when input items are returned via API.

            '
          enum:
          - in_progress
          - completed
          - incomplete
      required:
      - id
      - type
      - role
      - content
      - status
    OutputMessageContent:
      discriminator:
        propertyName: type
      anyOf:
      - $ref: '#/components/schemas/OutputTextContent'
      - $ref: '#/components/schemas/RefusalContent'
    OutputTextContent:
      properties:
        type:
          type: string
          enum:
          - output_text
          description: The type of the output text. Always `output_text`.
          default: output_text
        text:
          type: string
          description: The text output from the model.
        annotations:
          items:
            $ref: '#/components/schemas/responses_Annotation'
          type: array
          description: The annotations of the text output.
        logprobs:
          items:
            $ref: '#/components/schemas/LogProb'
          type: array
      type: object
      required:
      - type
      - text
      - annotations
      title: Output text
      description: A text output from the model.
    responses_Annotation:
      discriminator:
        propertyName: type
      anyOf:
      - $ref: '#/components/schemas/FileCitationBody'
      - $ref: '#/components/schemas/UrlCitationBody'
      - $ref: '#/components/schemas/ContainerFileCitationBody'
      - $ref: '#/components/schemas/FilePath'
    FileCitationBody:
      properties:
        type:
          type: string
          enum:
          - file_citation
          description: The type of the file citation. Always `file_citation`.
          default: file_citation
        file_id:
          type: string
          description: The ID of the file.
        index:
          type: integer
          description: The index of the file in the list of files.
        filename:
          type: string
          description: The filename of the file cited.
      type: object
      required:
      - type
      - file_id
      - index
      - filename
