      description: Controls how the model selects tools.
      oneOf:
      - $ref: '#/components/schemas/ToolChoiceAuto'
      - $ref: '#/components/schemas/ToolChoiceAny'
      - $ref: '#/components/schemas/ToolChoiceTool'
      - $ref: '#/components/schemas/ToolChoiceNone'
      discriminator:
        propertyName: type
        mapping:
          auto: '#/components/schemas/ToolChoiceAuto'
          any: '#/components/schemas/ToolChoiceAny'
          tool: '#/components/schemas/ToolChoiceTool'
          none: '#/components/schemas/ToolChoiceNone'
    ToolChoiceAuto:
      type: object
      properties:
        type:
          type: string
          enum:
          - auto
        disable_parallel_tool_use:
          type: boolean
          nullable: true
      required:
      - type
    ToolChoiceAny:
      type: object
      properties:
        type:
          type: string
          enum:
          - any
        disable_parallel_tool_use:
          type: boolean
          nullable: true
      required:
      - type
    ToolChoiceTool:
      type: object
      properties:
        type:
          type: string
          enum:
          - tool
        name:
          type: string
        disable_parallel_tool_use:
          type: boolean
          nullable: true
      required:
      - type
      - name
    ToolChoiceNone:
      type: object
      properties:
        type:
          type: string
          enum:
          - none
      required:
      - type
    ThinkingConfig:
      description: Extended thinking configuration.
      oneOf:
      - $ref: '#/components/schemas/EnabledThinkingConfig'
      - $ref: '#/components/schemas/DisabledThinkingConfig'
      discriminator:
        propertyName: type
        mapping:
          enabled: '#/components/schemas/EnabledThinkingConfig'
          disabled: '#/components/schemas/DisabledThinkingConfig'
    EnabledThinkingConfig:
      type: object
      properties:
        type:
          type: string
          enum:
          - enabled
        budget_tokens:
          type: integer
          minimum: 1024
      required:
      - type
      - budget_tokens
    DisabledThinkingConfig:
      type: object
      properties:
        type:
          type: string
          enum:
          - disabled
      required:
      - type
    MessagesResponse:
      type: object
      description: Anthropic-native non-streaming Messages API response.
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - message
        role:
          type: string
          enum:
          - assistant
        model:
          type: string
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        stop_reason:
          type: string
          nullable: true
          enum:
          - end_turn
          - max_tokens
          - stop_sequence
          - tool_use
          - pause_turn
          - refusal
        stop_sequence:
          type: string
          nullable: true
        usage:
          $ref: '#/components/schemas/Usage'
        container:
          $ref: '#/components/schemas/Container'
          nullable: true
      required:
      - id
      - type
      - role
      - content
      - model
      - usage
    Usage:
      type: object
      description: Token counts reported for the request.
      properties:
        input_tokens:
          type: integer
          description: Number of input tokens charged for the request, not counting any tokens read from
            cache.
        output_tokens:
          type: integer
        cache_creation_input_tokens:
          type: integer
          nullable: true
          description: Number of input tokens stored into the prompt cache during this request.
        cache_read_input_tokens:
          type: integer
          nullable: true
          description: Number of input tokens read back from the prompt cache, which are billed at a reduced
            rate.
        cache_creation:
          $ref: '#/components/schemas/CacheCreation'
          nullable: true
        service_tier:
          type: string
          nullable: true
        server_tool_use:
          $ref: '#/components/schemas/ServerToolUsage'
          nullable: true
        nexos_credits_cost:
          type: number
          format: double
          description: Cost of the request in nexos credits.
      required:
      - input_tokens
      - output_tokens
    CacheCreation:
      type: object
      description: Breakdown of cache-write tokens split by cache lifetime tier.
      properties:
        ephemeral_5m_input_tokens:
          type: integer
        ephemeral_1h_input_tokens:
          type: integer
    ServerToolUsage:
      type: object
      description: Usage counts for each server-side tool, present when those tools ran during the request.
      properties:
        web_search_requests:
          type: integer
    Container:
      type: object
      description: Details of the execution container, included when the request used server-side code
        execution.
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - expires_at
    MessagesStreamEvent:
      description: 'Anthropic-native Messages API SSE event. Discriminated by `type`. Forwarded byte-for-byte

        from the upstream provider — public-api does not transform individual events.

        '
      oneOf:
      - $ref: '#/components/schemas/MessageStartEvent'
      - $ref: '#/components/schemas/ContentBlockStartEvent'
      - $ref: '#/components/schemas/ContentBlockDeltaEvent'
      - $ref: '#/components/schemas/ContentBlockStopEvent'
      - $ref: '#/components/schemas/MessageDeltaEvent'
      - $ref: '#/components/schemas/MessageStopEvent'
      - $ref: '#/components/schemas/PingEvent'
      - $ref: '#/components/schemas/ErrorEvent'
      discriminator:
        propertyName: type
        mapping:
          message_start: '#/components/schemas/MessageStartEvent'
          content_block_start: '#/components/schemas/ContentBlockStartEvent'
          content_block_delta: '#/components/schemas/ContentBlockDeltaEvent'
          content_block_stop: '#/components/schemas/ContentBlockStopEvent'
          message_delta: '#/components/schemas/MessageDeltaEvent'
          message_stop: '#/components/schemas/MessageStopEvent'
          ping: '#/components/schemas/PingEvent'
          error: '#/components/schemas/ErrorEvent'
    MessageStartEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - message_start
        message:
          $ref: '#/components/schemas/MessagesResponse'
      required:
      - type
      - message
    ContentBlockStartEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - content_block_start
        index:
          type: integer
        content_block:
          $ref: '#/components/schemas/ContentBlock'
      required:
      - type
      - index
      - content_block
    ContentBlockDeltaEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - content_block_delta
        index:
          type: integer
        delta:
          $ref: '#/components/schemas/ContentBlockDelta'
      required:
      - type
      - index
      - delta
    ContentBlockDelta:
      oneOf:
      - $ref: '#/components/schemas/TextDelta'
      - $ref: '#/components/schemas/InputJsonDelta'
      - $ref: '#/components/schemas/ThinkingDelta'
      - $ref: '#/components/schemas/SignatureDelta'
      - $ref: '#/components/schemas/CitationsDelta'
      discriminator:
        propertyName: type
        mapping:
          text_delta: '#/components/schemas/TextDelta'
          input_json_delta: '#/components/schemas/InputJsonDelta'
          thinking_delta: '#/components/schemas/ThinkingDelta'
          signature_delta: '#/components/schemas/SignatureDelta'
          citations_delta: '#/components/schemas/CitationsDelta'
    TextDelta:
      type: object
      properties:
        type:
          type: string
          enum:
          - text_delta
        text:
          type: string
      required:
      - type
      - text
    InputJsonDelta:
      type: object
      properties:
        type:
          type: string
          enum:
          - input_json_delta
        partial_json:
          type: string
      required:
      - type
      - partial_json
    ThinkingDelta:
      type: object
      properties:
        type:
          type: string
          enum:
          - thinking_delta
        thinking:
          type: string
      required:
      - type
      - thinking
    SignatureDelta:
      type: object
      properties:
        type:
          type: string
          enum:
          - signature_delta
        signature:
          type: string
      required:
      - type
      - signature
    CitationsDelta:
      type: object
      properties:
        type:
          type: string
          enum:
          - citations_delta
        citation:
          type: object
          properties:
            type:
              type: string
          required:
          - type
      required:
      - type
      - citation
    ContentBlockStopEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - content_block_stop
        index:
          type: integer
      required:
      - type
      - index
    MessageDeltaEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - message_delta
        delta:
          $ref: '#/components/schemas/MessageDelta'
        usage:
          $ref: '#/components/schemas/Usage'
      required:
      - type
      - delta
      - usage
    MessageDelta:
      type: object
      description: Top-level message delta carrying terminal stop_reason / stop_sequence.
      properties:
        stop_reason:
          type: string
          nullable: true
          enum:
          - end_turn
          - max_tokens
          - stop_sequence
          - tool_use
          - pause_turn
          - refusal
        stop_sequence:
          type: string
          nullable: true
    MessageStopEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - message_stop
      required:
      - type
    PingEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - ping
      required:
      - type
    ErrorEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - error
        error:
          type: object
          properties:
            type:
              type: string
            message:
              type: string
          required:
          - type
          - message
      required:
      - type
      - error
    UserModel:
      type: object
      properties:
        id:
          type: string
          description: The model identifier, which can be referenced in the API endpoints.
        nexos_model_id:
          type: string
          description: Internal model identifier, which also can be referenced in the API endpoints.
        object:
          type: string
          description: The object type, which is always "model".
        created:
          type: integer
          format: int64
          description: The Unix timestamp (in seconds) when the model was created.
        updated:
          type: integer
          format: int64
          description: The Unix timestamp (in seconds) when the model was updated.
        owned_by:
          type: string
          description: The organization that owns the model.
        name:
          type: string
          description: Model name
          deprecated: true
        timeout_ms:
          type: integer
          format: int32
          minimum: 1
          description: Model response timeout (milliseconds)
        stream_timeout_ms:
          type: integer
          format: int32
          minimum: 1
          description: Model response timeout when streaming is enabled (milliseconds)
        max_tokens:
          type: integer
          format: int32
          minimum: 1
          description: Maximum number of tokens the model can generate in a single request.
        context_length:
          type: integer
          format: int32
          minimum: 1
          description: Maximum number of context (input) tokens the model supports.
        pricing:
          $ref: '#/components/schemas/ModelPricing'
        endpoints:
          $ref: '#/components/schemas/Endpoints'
      required:
      - id
      - object
      - created
      - updated
      - name
      - owned_by
    ModelPricing:
      properties:
        input_cost_per_token:
          type: string
        output_cost_per_token:
          type: string
        input_cost_per_second:
          type: string
        output_cost_per_second:
          type: string
      type: object
      title: Model Pricing
    Endpoints:
      type: array
      items:
        type: string
        description: Array of endpoints supported by model
        enum:
        - chat_completion
        - messages
        - completion
        - responses
        - realtime
        - assistants
        - batch
        - fine_tuning
        - embeddings
        - image_generation
        - speech_generation
        - transcription
        - translation
        - moderation
    ModelFallbacksConfiguration:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the model
        fallback_ids:
          $ref: '#/components/schemas/ModelFallbacks'
        created_at:
          type: string
          format: date-time
          description: The time the model fallbacks configuration was created.
        updated_at:
          type: string
          format: date-time
          description: The time the model fallbacks configuration was last updated.
      required:
      - id
    ModelFallbacks:
      type: array
      items:
        type: string
        format: uuid
        description: The ID of the model to associate with the company.
    ModelFallbacksRequest:
      type: object
      properties:
        models:
          $ref: '#/components/schemas/ModelFallbacks'
      required:
      - models
    CreateResponseRequest:
      allOf:
      - $ref: '#/components/schemas/CreateModelResponseProperties'
      - $ref: '#/components/schemas/ResponseProperties'
      - type: object
        properties:
          input:
            $ref: '#/components/schemas/InputParam'
          include:
            type: array
            description: 'Specify additional output data to include in the model response. Currently supported
              values are:

              - `web_search_call.action.sources`: Include the sources of the web search tool call.

              - `code_interpreter_call.outputs`: Includes the outputs of python code execution in code
              interpreter tool call items.

              - `computer_call_output.output.image_url`: Include image urls from the computer call output.

              - `file_search_call.results`: Include the search results of the file search tool call.

              - `message.input_image.image_url`: Include image urls from the input message.

              - `message.output_text.logprobs`: Include logprobs with assistant messages.

              - `reasoning.encrypted_content`: Includes an encrypted version of reasoning tokens in reasoning
              item outputs. This enables reasoning items to be used in multi-turn conversations when using
              the Responses API statelessly (like when the `store` parameter is set to `false`, or when
              an organization is enrolled in the zero data retention program).'
            items:
              $ref: '#/components/schemas/IncludeEnum'
            nullable: true
          parallel_tool_calls:
            type: boolean
            description: 'Whether to allow the model to run tool calls in parallel.

              '
            default: true
            nullable: true
          store:
            type: boolean
            description: 'Whether to store the generated model response for later retrieval via

              API.

              '
            default: true
            nullable: true
          instructions:
            type: string
            description: 'A system (or developer) message inserted into the model''s context.


              When using along with `previous_response_id`, the instructions from a previous

              response will not be carried over to the next response. This makes it simple

              to swap out system (or developer) messages in new responses.

              '
            nullable: true
          stream:
            description: 'If set to true, the model response data will be streamed to the client

              as it is generated using [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format).

              '
            type: boolean
            default: false
            nullable: true
          stream_options:
            $ref: '#/components/schemas/ResponseStreamOptions'
          conversation:
            $ref: '#/components/schemas/ConversationParam'
            nullable: true
    CreateModelResponseProperties:
      allOf:
      - $ref: '#/components/schemas/ModelResponseProperties'
      - type: object
        properties:
          top_logprobs:
            description: 'An integer between 0 and 20 specifying the number of most likely tokens to

              return at each token position, each with an associated log probability.

              '
            type: integer
            minimum: 0
            maximum: 20
    ModelResponseProperties:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/responses_Metadata'
        top_logprobs:
          description: 'An integer between 0 and 20 specifying the number of most likely tokens to

            return at each token position, each with an associated log probability.

            '
          type: integer
          minimum: 0
          maximum: 20
          nullable: true
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
          description: 'What sampling temperature to use, between 0 and 2. Higher values like 0.8 will
            make the output more random, while lower values like 0.2 will make it more focused and deterministic.

            We generally recommend altering this or `top_p` but not both.

            '
          nullable: true
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 1
          description: 'An alternative to sampling with temperature, called nucleus sampling,

            where the model considers the results of the tokens with top_p probability

            mass. So 0.1 means only the tokens comprising the top 10% probability mass

            are considered.


            We generally recommend altering this or `temperature` but not both.

            '
          nullable: true
        user:
          type: string
          deprecated: true
          description: 'Deprecated in favor of `safety_identifier` and `prompt_cache_key`; use `prompt_cache_key`
            to maintain caching. A stable end-user identifier to improve cache hit rates and help detect
            abuse.

            '
        safety_identifier:
          type: string
          description: 'A stable identifier used to help detect users who may violate usage policies.
            Use a unique per-user string (e.g., a hash of username or email) to avoid sending identifying
            information.

            '
        prompt_cache_key:
          type: string
          description: 'Used to cache responses for similar requests and improve cache hit rates. Replaces
            the `user` field.

            '
        service_tier:
          $ref: '#/components/schemas/ServiceTier'
        prompt_cache_retention:
          type: string
          enum:
          - in-memory
          - 24h
          description: 'Retention policy for the prompt cache. Set to `24h` to keep cached prefixes active
            longer (up to 24 hours).

            '
          nullable: true
    responses_Metadata:
      type: object
      description: 'Set of 16 key-value pairs that can be attached to an object. This can be

        useful for storing additional information about the object in a structured

        format, and querying for objects via API or the dashboard.


        Keys are strings with a maximum length of 64 characters. Values are strings

        with a maximum length of 512 characters.

        '
      additionalProperties:
        type: string
      nullable: true
    ServiceTier:
      type: string
      description: 'Specifies the processing tier for the request.

        The response includes the actual tier used, which may differ from the requested value.

        '
      enum:
      - auto
      - default
      - flex
      - scale
      - priority
      default: auto
      nullable: true
    ResponseProperties:
      type: object
      required:
      - model
      properties:
        previous_response_id:
          type: string
          description: 'The unique ID of the previous response to the model. Use this to create multi-turn
            conversations. Cannot be used with `conversation`.

            '
          nullable: true
        model:
          description: 'Model ID used to generate the response (e.g., `gpt-4o` or `o3`). See your provider''s
            model guide for available options.

            '
          type: string
        reasoning:
          $ref: '#/components/schemas/Reasoning'
          nullable: true
        background:
          type: boolean
          description: 'Whether to run the model response in the background.

            '
          default: false
          nullable: true
        max_output_tokens:
          description: 'An upper bound for the number of tokens that can be generated for a response,
            including visible output tokens and reasoning tokens.

            '
          type: integer
          nullable: true
        max_tool_calls:
          description: 'The maximum number of total calls to built-in tools that can be processed in a
            response. This maximum number applies across all built-in tool calls, not per individual tool.
            Any further attempts to call a tool by the model will be ignored.

            '
          type: integer
          nullable: true
        text:
          $ref: '#/components/schemas/ResponseTextParam'
        tools:
          $ref: '#/components/schemas/ToolsArray'
        tool_choice:
          $ref: '#/components/schemas/ToolChoiceParam'
        prompt:
          $ref: '#/components/schemas/Prompt'
        truncation:
          type: string
          description: "The truncation strategy to use for the model response.\n- `auto`: If the input\
            \ to this Response exceeds\n  the model's context window size, the model will truncate the\n\
            \  response to fit the context window by dropping items from the beginning of the conversation.\n\
            - `disabled` (default): If the input size will exceed the context window\n  size for a model,\
            \ the request will fail with a 400 error.\n"
          enum:
          - auto
          - disabled
          default: disabled
          nullable: true
    Reasoning:
      type: object
      description: 'Configuration options for reasoning models. Applicable to gpt-5 and o-series models
        only.

        '
      title: Reasoning
      properties:
        effort:
          $ref: '#/components/schemas/ReasoningEffort'
        mode:
          type: string
          description: 'Reasoning mode for models that support it. One of `standard` or `pro`.

            '
          enum:
          - standard
          - pro
        summary:
          type: string
          nullable: true
          description: 'A summary of the model''s reasoning.

            One of `auto`, `concise`, or `detailed` (only `concise` is supported for `computer-use-preview`).

            '
          enum:
          - auto
          - concise
          - detailed
        generate_summary:
          type: string
          nullable: true
          deprecated: true
          description: 'Deprecated: use `summary` instead.

            A summary of the model''s reasoning. One of `auto`, `concise`, or `detailed`.

            '
          enum:
          - auto
          - concise
          - detailed
    ReasoningEffort:
      type: string
      nullable: true
      enum:
      - none
      - minimal
      - low
      - medium
      - high
      default: medium
      description: 'Controls how much reasoning effort the model uses. Lower settings are faster and use
        fewer tokens; higher settings provide more detailed reasoning.

        '
    ResponseTextParam:
      type: object
      description: 'Configuration options for a text response. Supports plain text or structured JSON.

        '
      properties:
        format:
          $ref: '#/components/schemas/TextResponseFormatConfiguration'
        verbosity:
          $ref: '#/components/schemas/Verbosity'
    TextResponseFormatConfiguration:
      description: 'Specifies the required output format. Use `type: json_schema` to enforce a schema;
        `type: text` is the default.

        '
      anyOf:
      - $ref: '#/components/schemas/responses_ResponseFormatText'
      - $ref: '#/components/schemas/TextResponseFormatJsonSchema'
      - $ref: '#/components/schemas/responses_ResponseFormatJsonObject'
      discriminator:
        propertyName: type
    responses_ResponseFormatText:
      type: object
      title: Text
      description: 'Default response format. Used to generate text responses.

        '
      properties:
        type:
          type: string
          description: The type of response format being defined. Always `text`.
          enum:
          - text
      required:
      - type
    TextResponseFormatJsonSchema:
      type: object
      title: JSON schema
      description: 'JSON Schema response format used to generate structured JSON responses.

        Learn more in the Structured Outputs guide.

        '
      properties:
        type:
          type: string
          description: The type of response format being defined. Always `json_schema`.
          enum:
          - json_schema
        description:
          type: string
          description: 'A description of what the response format is for, used by the model to

            determine how to respond in the format.

            '
        name:
          type: string
          description: 'The name of the response format. Must be a-z, A-Z, 0-9, or contain

            underscores and dashes, with a maximum length of 64.

            '
        schema:
          $ref: '#/components/schemas/responses_ResponseFormatJsonSchemaSchema'
        strict:
          type: boolean
          nullable: true
          default: false
          description: 'Whether to enable strict schema adherence when generating the output.

            If true, the model will follow the exact schema; only a subset of JSON Schema is supported.

            '
      required:
      - type
      - schema
      - name
    responses_ResponseFormatJsonSchemaSchema:
      type: object
      title: JSON schema
      description: 'The schema for the response format, described as a JSON Schema object.

        Learn how to build JSON schemas [here](https://json-schema.org/).

        '
      additionalProperties: true
    responses_ResponseFormatJsonObject:
      type: object
      title: JSON object
      description: 'JSON object response format. An older method of generating JSON responses.

        Using `json_schema` is recommended for models that support it. Note that the

        model will not generate JSON without a system or user message instructing it

        to do so.

        '
      properties:
        type:
          type: string
          description: The type of response format being defined. Always `json_object`.
          enum:
          - json_object
      required:
      - type
    Verbosity:
      type: string
      nullable: true
      enum:
      - low
      - medium
      - high
      default: medium
      description: 'Constrains the verbosity of the model''s response. Lower values will result in

        more concise responses, while higher values will result in more verbose responses.

        Currently supported values are `low`, `medium`, and `high`.

        '
    ToolsArray:
      type: array
      description: 'An array of tools the model may call while generating a response. Categories include
        built-in tools, MCP tools, and custom function calls.

        '
      items:
        $ref: '#/components/schemas/responses_Tool'
    responses_Tool:
      description: 'A tool that can be used to generate a response.

        '
      discriminator:
        propertyName: type
      anyOf:
      - $ref: '#/components/schemas/FunctionTool'
      - $ref: '#/components/schemas/FileSearchTool'
      - $ref: '#/components/schemas/ComputerUsePreviewTool'
      - $ref: '#/components/schemas/WebSearchTool'
      - $ref: '#/components/schemas/MCPTool'
      - $ref: '#/components/schemas/CodeInterpreterTool'
      - $ref: '#/components/schemas/ImageGenTool'
      - $ref: '#/components/schemas/LocalShellToolParam'
      - $ref: '#/components/schemas/FunctionShellToolParam'
      - $ref: '#/components/schemas/CustomToolParam'
      - $ref: '#/components/schemas/WebSearchPreviewTool'
      - $ref: '#/components/schemas/ApplyPatchToolParam'
    FunctionTool:
      properties:
        type:
          type: string
          enum:
          - function
          description: The type of the function tool. Always `function`.
          default: function
        name:
          type: string
          description: The name of the function to call.
        description:
          type: string
          nullable: true
          description: A description of the function. Used by the model to determine whether or not to
            call the function.
        parameters:
          type: object
          nullable: true
          additionalProperties: {}
          description: A JSON schema object describing the parameters of the function.
        strict:
          type: boolean
          nullable: true
          description: Whether to enforce strict parameter validation. Default `true`.
      type: object
      required:
      - type
      - name
      - strict
      - parameters
      title: Function
      description: Defines a function in your code that the model can call.
    FileSearchTool:
      properties:
        type:
          type: string
          enum:
          - file_search
          description: The type of the file search tool. Always `file_search`.
          default: file_search
        vector_store_ids:
          items:
            type: string
          type: array
          description: The IDs of the vector stores to search.
        max_num_results:
          type: integer
          description: The maximum number of results to return. This number should be between 1 and 50
            inclusive.
        ranking_options:
          $ref: '#/components/schemas/RankingOptions'
          description: Ranking options for search.
        filters:
          $ref: '#/components/schemas/Filters'
          description: A filter to apply.
          nullable: true
      type: object
      required:
      - type
      - vector_store_ids
      title: File search
      description: Searches uploaded files for relevant content. See the file search guide.
    RankingOptions:
      properties:
        ranker:
          $ref: '#/components/schemas/RankerVersionType'
          description: The ranker to use for the file search.
        score_threshold:
          type: number
          description: The score threshold for the file search, a number between 0 and 1. Numbers closer
            to 1 will attempt to return only the most relevant results, but may return fewer results.
        hybrid_search:
          $ref: '#/components/schemas/HybridSearchOptions'
          description: Weights that control how reciprocal rank fusion balances semantic embedding matches
            versus sparse keyword matches when hybrid search is enabled.
      type: object
      required: []
    RankerVersionType:
      type: string
      enum:
      - auto
      - default-2024-11-15
    HybridSearchOptions:
      properties:
        embedding_weight:
          type: number
          description: The weight of the embedding in the reciprocal ranking fusion.
        text_weight:
          type: number
          description: The weight of the text in the reciprocal ranking fusion.
      type: object
      required:
      - embedding_weight
      - text_weight
    Filters:
      anyOf:
      - $ref: '#/components/schemas/ComparisonFilter'
      - $ref: '#/components/schemas/CompoundFilter'
    ComparisonFilter:
      type: object
      additionalProperties: false
      title: Comparison Filter
      description: 'A filter used to compare a specified attribute key to a given value using a defined
        comparison operation.

        '
      properties:
        type:
          type: string
          default: eq
          enum:
          - eq
          - ne
          - gt
          - gte
          - lt
          - lte
          description: 'Specifies the comparison operator: `eq`, `ne`, `gt`, `gte`, `lt`, `lte`, `in`,
            `nin`.

            - `eq`: equals

            - `ne`: not equal

            - `gt`: greater than

            - `gte`: greater than or equal

            - `lt`: less than

            - `lte`: less than or equal

            - `in`: in

            - `nin`: not in

            '
        key:
          type: string
          description: The key to compare against the value.
        value:
          description: The value to compare against the attribute key; supports string, number, or boolean
            types.
          anyOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              $ref: '#/components/schemas/ComparisonFilterValueItems'
      required:
      - type
      - key
      - value
    ComparisonFilterValueItems:
      anyOf:
      - type: string
      - type: number
    CompoundFilter:
      type: object
      additionalProperties: false
      title: Compound Filter
      description: Combine multiple filters using `and` or `or`.
      properties:
        type:
          type: string
          description: 'Type of operation: `and` or `or`.'
          enum:
          - and
          - or
        filters:
          type: array
          description: Array of filters to combine. Items can be `ComparisonFilter` or `CompoundFilter`.
          items:
            discriminator:
              propertyName: type
            anyOf:
            - $ref: '#/components/schemas/ComparisonFilter'
            - $ref: '#/components/schemas/CompoundFilter'
      required:
      - type
      - filters
    ComputerUsePreviewTool:
      properties:
        type:
          type: string
          enum:
          - computer_use_preview
          description: The type of the computer use tool. Always `computer_use_preview`.
          default: computer_use_preview
        environment:
          $ref: '#/components/schemas/ComputerEnvironment'
          description: The type of computer environment to control.
        display_width:
          type: integer
          description: The width of the computer display.
        display_height:
          type: integer
          description: The height of the computer display.
      type: object
      required:
      - type
      - environment
      - display_width
      - display_height
      title: Computer use preview
      description: A tool that controls a virtual computer. Learn more in the computer tool guide.
    ComputerEnvironment:
      type: string
      enum:
      - windows
      - mac
      - linux
      - ubuntu
      - browser
    WebSearchTool:
      type: object
      title: Web search
      description: 'Search the internet for sources related to the prompt. Learn more in the web search
        tool guide.

        '
      properties:
        type:
          type: string
          enum:
          - web_search
          - web_search_2025_08_26
          description: The type of the web search tool. One of `web_search` or `web_search_2025_08_26`.
          default: web_search
        filters:
          type: object
          description: 'Filters for the search.

            '
          properties:
            allowed_domains:
              type: array
              title: Allowed domains for the search.
              description: 'Allowed domains for the search. If not provided, all domains are allowed.

                Subdomains of the provided domains are allowed as well.


                Example: `["pubmed.ncbi.nlm.nih.gov"]`

                '
              items:
                type: string
                description: Allowed domain for the search.
              default: []
              nullable: true
          nullable: true
        user_location:
          $ref: '#/components/schemas/WebSearchApproximateLocation'
        search_context_size:
          type: string
          enum:
          - low
          - medium
          - high
          default: medium
          description: High level guidance for the amount of context window space to use for the search.
            One of `low`, `medium`, or `high`. `medium` is the default.
      required:
      - type
    WebSearchApproximateLocation:
      type: object
      nullable: true
      title: Web search approximate location
      description: 'The approximate location of the user.

        '
      properties:
        type:
          type: string
          enum:
          - approximate
          description: The type of location approximation. Always `approximate`.
          default: approximate
        country:
          type: string
          nullable: true
          description: The two-letter [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1) of
            the user, e.g. `US`.
        region:
          type: string
          nullable: true
          description: Free text input for the region of the user, e.g. `California`.
        city:
          type: string
          nullable: true
          description: Free text input for the city of the user, e.g. `San Francisco`.
        timezone:
          type: string
          nullable: true
          description: The [IANA timezone](https://timeapi.io/documentation/iana-timezones) of the user,
            e.g. `America/Los_Angeles`.
    MCPTool:
      type: object
      title: MCP tool
      description: 'Give the model access to tools via remote Model Context Protocol (MCP) servers. Learn
        more in the MCP guide.

        '
      properties:
        type:
          type: string
          enum:
          - mcp
          description: The type of the MCP tool. Always `mcp`.
        server_label:
          type: string
          description: 'A label for this MCP server, used to identify it in tool calls.

            '
        server_url:
          type: string
          description: 'The URL for the MCP server. One of `server_url` or `connector_id` must be

            provided.

            '
        connector_id:
          type: string
          enum:
          - connector_dropbox
          - connector_gmail
          - connector_googlecalendar
          - connector_googledrive
          - connector_microsoftteams
          - connector_outlookcalendar
          - connector_outlookemail
          - connector_sharepoint
          description: 'Identifier for service connectors, like those available in ChatGPT. One of

            `server_url` or `connector_id` must be provided.


            Currently supported `connector_id` values are:


            - Dropbox: `connector_dropbox`

            - Gmail: `connector_gmail`

            - Google Calendar: `connector_googlecalendar`

            - Google Drive: `connector_googledrive`

            - Microsoft Teams: `connector_microsoftteams`

            - Outlook Calendar: `connector_outlookcalendar`

            - Outlook Email: `connector_outlookemail`

            - SharePoint: `connector_sharepoint`

            '
        authorization:
          type: string
          description: 'An OAuth access token that can be used with a remote MCP server, either

            with a custom MCP server URL or a service connector. Your application

            must handle the OAuth authorization flow and provide the token here.

            '
        server_description:
          type: string
          description: 'Optional description of the MCP server, used to provide more context.

            '
        headers:
          type: object
          additionalProperties:
            type: string
          description: 'Optional HTTP headers to send to the MCP server. Use for authentication

            or other purposes.

            '
          nullable: true
        allowed_tools:
          description: 'List of allowed tool names or a filter object.

            '
          anyOf:
          - type: array
            title: MCP allowed tools
            description: A string array of allowed tool names
            items:
              type: string
          - $ref: '#/components/schemas/MCPToolFilter'
          nullable: true
        require_approval:
          description: Specify which of the MCP server's tools require approval.
          default: always
          anyOf:
          - type: object
            title: MCP tool approval filter
            description: 'Specify which of the MCP server''s tools require approval. Can be

              `always`, `never`, or a filter object associated with tools

              that require approval.

              '
            properties:
              always:
                $ref: '#/components/schemas/MCPToolFilter'
              never:
                $ref: '#/components/schemas/MCPToolFilter'
            additionalProperties: false
          - type: string
            title: MCP tool approval setting
            description: 'Specify a single approval policy for all tools. One of `always` or

              `never`. When set to `always`, all tools will require approval. When

              set to `never`, all tools will not require approval.

              '
            enum:
            - always
            - never
          nullable: true
      required:
      - type
      - server_label
    MCPToolFilter:
      type: object
      title: MCP tool filter
      description: 'A filter object to specify which tools are allowed.

        '
      properties:
        tool_names:
          type: array
          title: MCP allowed tools
          items:
            type: string
          description: List of allowed tool names.
        read_only:
          type: boolean
          description: 'Indicates whether or not a tool modifies data or is read-only. If an

            MCP server is [annotated with `readOnlyHint`](https://modelcontextprotocol.io/specification/2025-06-18/schema#toolannotations-readonlyhint),

            it will match this filter.

            '
      required: []
      additionalProperties: false
    CodeInterpreterTool:
      type: object
      title: Code interpreter
      description: 'A tool that runs Python code to help generate a response to a prompt.

        '
      properties:
        type:
          type: string
          enum:
          - code_interpreter
          description: 'The type of the code interpreter tool. Always `code_interpreter`.

            '
        container:
          description: 'The code interpreter container. Can be a container ID or an object that

            specifies uploaded file IDs to make available to your code.

            '
          anyOf:
          - type: string
            description: The container ID.
          - $ref: '#/components/schemas/CodeInterpreterContainerAuto'
      required:
      - type
      - container
    CodeInterpreterContainerAuto:
      properties:
        type:
          type: string
          enum:
          - auto
          description: Always `auto`.
          default: auto
        file_ids:
          items:
            type: string
          type: array
          maxItems: 50
          description: An optional list of uploaded files to make available to your code.
        memory_limit:
          $ref: '#/components/schemas/ContainerMemoryLimit'
          nullable: true
      type: object
      required:
      - type
      title: CodeInterpreterToolAuto
      description: Configuration for a code interpreter container. Optionally specify the IDs of the files
        to run the code on.
    ContainerMemoryLimit:
      type: string
      enum:
      - 1g
      - 4g
      - 16g
      - 64g
    ImageGenTool:
      type: object
      title: Image generation tool
      description: 'A tool that generates images using a model like `gpt-image-1`.

        '
      properties:
        type:
          type: string
          enum:
          - image_generation
          description: 'The type of the image generation tool. Always `image_generation`.

            '
        model:
          type: string
          enum:
          - gpt-image-1
