      description: Allows the assistant to create, delete, or update files using unified diffs.
    ToolChoiceParam:
      description: 'How the model should select which tool (or tools) to use when generating

        a response. See the `tools` parameter to see how to specify which tools

        the model can call.

        '
      anyOf:
      - $ref: '#/components/schemas/ToolChoiceOptions'
      - $ref: '#/components/schemas/ToolChoiceAllowed'
      - $ref: '#/components/schemas/ToolChoiceTypes'
      - $ref: '#/components/schemas/ToolChoiceFunction'
      - $ref: '#/components/schemas/ToolChoiceMCP'
      - $ref: '#/components/schemas/ToolChoiceCustom'
      - $ref: '#/components/schemas/SpecificApplyPatchParam'
      - $ref: '#/components/schemas/SpecificFunctionShellParam'
    ToolChoiceOptions:
      type: string
      title: Tool choice mode
      description: 'Controls which (if any) tool is called by the model.


        `none` means the model will not call any tool and instead generates a message.


        `auto` means the model can pick between generating a message or calling one or

        more tools.


        `required` means the model must call one or more tools.

        '
      enum:
      - none
      - auto
      - required
    ToolChoiceAllowed:
      type: object
      title: Allowed tools
      description: 'Constrains the tools available to the model to a pre-defined set.

        '
      properties:
        type:
          type: string
          enum:
          - allowed_tools
          description: Allowed tool configuration type. Always `allowed_tools`.
        mode:
          type: string
          enum:
          - auto
          - required
          description: 'Constrains the tools available to the model to a pre-defined set.


            `auto` allows the model to pick from among the allowed tools and generate a

            message.


            `required` requires the model to call one or more of the allowed tools.

            '
        tools:
          type: array
          description: "A list of tool definitions that the model should be allowed to call.\n\nFor the\
            \ Responses API, the list of tool definitions might look like:\n```json\n[\n  { \"type\":\
            \ \"function\", \"name\": \"get_weather\" },\n  { \"type\": \"mcp\", \"server_label\": \"\
            deepwiki\" },\n  { \"type\": \"image_generation\" }\n]\n```\n"
          items:
            type: object
            description: 'A tool definition that the model should be allowed to call.

              '
            additionalProperties: true
      required:
      - type
      - mode
      - tools
    ToolChoiceTypes:
      type: object
      title: Hosted tool
      description: 'Indicates that the model should use a built-in tool to generate a response.

        Use this to select a specific hosted capability.

        '
      properties:
        type:
          type: string
          description: "The type of hosted tool the model should to use. \n\nAllowed values are:\n- `file_search`\n\
            - `web_search_preview`\n- `computer_use_preview`\n- `code_interpreter`\n- `image_generation`\n"
          enum:
          - file_search
          - web_search_preview
          - computer_use_preview
          - web_search_preview_2025_03_11
          - image_generation
          - code_interpreter
      required:
      - type
    ToolChoiceFunction:
