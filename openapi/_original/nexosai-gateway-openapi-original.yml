        quality:
          type: string
          enum:
          - low
          - medium
          - high
          - auto
          description: 'The quality of the generated image. One of `low`, `medium`, `high`,

            or `auto`. Default: `auto`.

            '
          default: auto
        size:
          type: string
          enum:
          - 1024x1024
          - 1024x1536
          - 1536x1024
          - auto
          description: 'The size of the generated image. One of `1024x1024`, `1024x1536`,

            `1536x1024`, or `auto`. Default: `auto`.

            '
          default: auto
        output_format:
          type: string
          enum:
          - png
          - webp
          - jpeg
          description: 'The output format of the generated image. One of `png`, `webp`, or

            `jpeg`. Default: `png`.

            '
          default: png
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
          description: 'Compression level for the output image. Default: 100.

            '
          default: 100
        moderation:
          type: string
          enum:
          - auto
          - low
          description: 'Moderation level for the generated image. Default: `auto`.

            '
          default: auto
        background:
          type: string
          enum:
          - transparent
          - opaque
          - auto
          description: 'Background type for the generated image. One of `transparent`,

            `opaque`, or `auto`. Default: `auto`.

            '
          default: auto
        input_fidelity:
          $ref: '#/components/schemas/InputFidelity'
          nullable: true
        input_image_mask:
          type: object
          description: 'Optional mask for inpainting. Contains `image_url`

            (string, optional) and `file_id` (string, optional).

            '
          properties:
            image_url:
              type: string
              description: 'Base64-encoded mask image.

                '
            file_id:
              type: string
              description: 'File ID for the mask image.

                '
          required: []
          additionalProperties: false
        partial_images:
          type: integer
          minimum: 0
          maximum: 3
          description: 'Number of partial images to generate in streaming mode, from 0 (default value)
            to 3.

            '
          default: 0
      required:
      - type
    InputFidelity:
      type: string
      enum:
      - high
      - low
      description: Control how much effort the model will exert to match the style and features, especially
        facial features, of input images. This parameter is only supported for `gpt-image-1`. Unsupported
        for `gpt-image-1-mini`. Supports `high` and `low`. Defaults to `low`.
    LocalShellToolParam:
      properties:
