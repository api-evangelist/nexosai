            description: A text input to the model, equivalent to a text input with the `user` role.
          - items:
              $ref: '#/components/schemas/InputItem'
            type: array
          nullable: true
        previous_response_id:
          type: string
          description: The unique ID of the previous response to the model. Use this to create multi-turn
            conversations.
          nullable: true
        tools:
          items:
            $ref: '#/components/schemas/responses_Tool'
          type: array
          description: An array of tools the model may call while generating a response. You can specify
            which tool to use by setting the `tool_choice` parameter.
          nullable: true
        text:
          $ref: '#/components/schemas/ResponseTextParam'
          nullable: true
        reasoning:
          $ref: '#/components/schemas/Reasoning'
          description: '**gpt-5 and o-series models only**'
          nullable: true
        truncation:
          $ref: '#/components/schemas/TruncationEnum'
          description: 'The truncation strategy to use for the model response. - `auto`: If the input
            to this Response exceeds the model''s context window size, the model will truncate the response
            to fit the context window by dropping items from the beginning of the conversation. - `disabled`
            (default): If the input size will exceed the context window size for a model, the request
            will fail with a 400 error.'
        instructions:
          type: string
          description: 'A system (or developer) message inserted into the model''s context.

            When used along with `previous_response_id`, the instructions from a previous response will
            not be carried over to the next response. This makes it simple to swap out system (or developer)
            messages in new responses.'
          nullable: true
        conversation:
          $ref: '#/components/schemas/ConversationParam'
          nullable: true
        tool_choice:
          $ref: '#/components/schemas/ToolChoiceParam'
          nullable: true
        parallel_tool_calls:
          type: boolean
          description: Whether to allow the model to run tool calls in parallel.
          nullable: true
      type: object
      required: []
    TruncationEnum:
      type: string
      enum:
      - auto
      - disabled
