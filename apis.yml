aid: nexosai
name: nexos.ai
description: >-
  nexos.ai is an enterprise AI platform and OpenAI-compatible AI gateway that unifies many
  large language model providers behind a single API key and governed workspace. Its Gateway API
  exposes chat completions, responses, messages, embeddings, images, audio (speech, transcription,
  translation), batches, files, and storage, alongside management surfaces for models and fallbacks,
  teams, users, agents, assistants, companies, API keys, and per-company/team/user budget limits.
  Organizations get guardrails, observability, smart routing across models, agents (Agent Builder
  with human-in-the-loop approvals), and integrations with tools like Slack, Atlassian, GitHub,
  Google Workspace, and Microsoft 365. Founded by the team behind Nord Security and backed by
  Index Ventures and Creandum. This profile was enriched from the provider's public docs at
  docs.nexos.ai.
